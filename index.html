<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow"><title>KapStream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 0.75rem; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body class="min-h-screen bg-gray-900 text-white p-4 sm:p-8">
    <header class="text-center mb-8">
        <h1 class="text-4xl sm:text-5xl font-extrabold text-indigo-400 mb-2">KapStream</h1>
        <div class="flex justify-center gap-4 mb-8">
            <button id="movie-button" onclick="setType('movie')" class="py-2 px-6 rounded-full font-semibold bg-indigo-600 shadow-lg transition-all">Movies</button>
            <button id="tv-button" onclick="setType('tv')" class="py-2 px-6 rounded-full font-semibold bg-gray-700 text-gray-300 hover:bg-gray-600 transition-all">TV Series</button>
        </div>
        <input type="text" id="search-input" placeholder="Search..." class="max-w-md w-full p-3 rounded-lg bg-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none">
    </header>
    <div id="err-box" class="hidden bg-red-600 p-4 rounded-lg mb-6 text-center"></div>
    <div id="content-display"></div>

    <script>
        const API_KEY = '47d9d5e21090f4de14010605a2f5d5ca', IMG_URL = 'https://image.tmdb.org/t/p/w500', PLCHOLDER = 'https://placehold.co/500x750?text=No+Poster';
        let list = [], selected = null, loading = true, page = 1, hasMore = true, query = '', type = 'movie', curS = 1, curE = 1, maxE = 1;

        const $ = id => document.getElementById(id);
        const err = (m) => { if(m) { $('err-box').innerText = m; $('err-box').classList.remove('hidden'); } else $('err-box').classList.add('hidden'); };

        function setType(t) {
            type = t; page = 1;
            $('movie-button').className = `py-2 px-6 rounded-full font-semibold transition-all ${t==='movie'?'bg-indigo-600 shadow-lg':'bg-gray-700 text-gray-300'}`;
            $('tv-button').className = `py-2 px-6 rounded-full font-semibold transition-all ${t==='tv'?'bg-indigo-600 shadow-lg':'bg-gray-700 text-gray-300'}`;
            fetchContent();
        }

        async function fetchContent() {
            loading = true; render(); err(null);
            const url = query ? `https://api.themoviedb.org/3/search/${type}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&page=${page}` : `https://api.themoviedb.org/3/${type}/popular?api_key=${API_KEY}&page=${page}`;
            try { 
                const res = await fetch(url); const data = await res.json(); 
                list = page === 1 ? data.results : [...list, ...data.results]; 
                hasMore = data.page < data.total_pages; 
            } catch (e) { err("Connection error. Check API key."); }
            loading = false; render();
        }

        async function fetchDetails(id, t) {
            loading = true; render();
            try {
                const [d, ex] = await Promise.all([
                    fetch(`https://api.themoviedb.org/3/${t}/${id}?api_key=${API_KEY}`).then(r => r.json()),
                    fetch(`https://api.themoviedb.org/3/${t}/${id}/external_ids?api_key=${API_KEY}`).then(r => r.json())
                ]);
                selected = {...d, imdb_id: ex.imdb_id, content_type: t};
                if (t === 'tv') { 
                    const first = d.seasons?.find(s => s.season_number > 0);
                    curS = first ? first.season_number : 1;
                    await updateMaxEp(); 
                }
            } catch { err("Failed to load details."); }
            loading = false; render();
        }

        async function updateMaxEp() {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${selected.id}/season/${curS}?api_key=${API_KEY}`).then(r => r.json());
                maxE = res.episodes ? res.episodes.length : 1;
            } catch { maxE = 1; }
        }

        async function changeS(v) { 
            if(v==='custom') { const p = prompt("Season:"); if(p) curS = parseInt(p); } else curS = parseInt(v);
            curE = 1; await updateMaxEp(); render(); 
        }

        function render() {
            if (selected) {
                const s = selected, isTV = s.content_type === 'tv';
                const date = isTV ? s.first_air_date : s.release_date;
                const year = date ? `(${date.split('-')[0]})` : '';
                const fullDate = date ? new Date(date).toLocaleDateString() : 'Unknown';
                const src = isTV ? `https://vidsrc.me/embed/tv?imdb=${s.imdb_id}&season=${curS}&episode=${curE}&ds_lang=en` : `https://vidsrc.me/embed/${s.imdb_id}?ds_lang=en`;
                let sOpt = '', eOpt = '';
                if(isTV && s.seasons) {
                    s.seasons.filter(x => x.season_number > 0).forEach(x => sOpt += `<option value="${x.season_number}" ${x.season_number==curS?'selected':''}>Season ${x.season_number}</option>`);
                    for(let i=1; i<=maxE; i++) eOpt += `<option value="${i}" ${i==curE?'selected':''}>Episode ${i}</option>`;
                }
                $('content-display').innerHTML = `
                    <div class="max-w-4xl mx-auto bg-gray-800 rounded-xl p-6 relative">
                        <button onclick="selected=null;render()" class="absolute top-4 right-4 bg-indigo-600 p-2 rounded-full shadow-lg">✕</button>
                        <div class="flex flex-col md:flex-row gap-6 mb-8">
                            <img src="${s.poster_path?IMG_URL+s.poster_path:PLCHOLDER}" class="w-48 rounded-lg">
                            <div class="text-center md:text-left">
                                <h2 class="text-3xl font-bold text-indigo-300">${s.title || s.name} <span class="text-gray-500">${year}</span></h2>
                                <p class="text-gray-400 my-2">Release Date: ${fullDate}</p>
                                <p class="text-gray-300 line-clamp-6">${s.overview || "No overview available."}</p>
                            </div>
                        </div>
                        <div class="text-center">
                            <h3 class="text-2xl font-bold mb-4">Watch Now</h3>
                            ${isTV ? `<div class="flex flex-wrap justify-center gap-4 mb-4">
                                <select onchange="changeS(this.value)" class="bg-gray-700 p-2 rounded">${sOpt}<option value="custom">Custom...</option></select>
                                <select onchange="curE=parseInt(this.value);render()" class="bg-gray-700 p-2 rounded">${eOpt}</select>
                                <button onclick="nextEp()" class="bg-indigo-600 p-2 px-4 rounded font-bold">Next >></button>
                            </div>` : ''}
                            <div class="video-container"><iframe src="${src}" allowfullscreen></iframe></div>
                        </div>
                    </div>`;
            } else {
                let cards = list.map(c => {
                    const d = type === 'tv' ? c.first_air_date : c.release_date;
                    const y = d ? `(${d.split('-')[0]})` : '';
                    return `<div onclick="fetchDetails(${c.id},'${type}')" class="bg-gray-800 rounded-xl overflow-hidden cursor-pointer hover:scale-105 transition shadow-lg">
                        <img src="${c.poster_path?IMG_URL+c.poster_path:PLCHOLDER}" class="w-full">
                        <div class="p-3 text-center"><div class="truncate font-semibold">${c.title || c.name}</div><div class="text-xs text-gray-500 mt-1">${y}</div></div>
                    </div>`
                }).join('');
                $('content-display').innerHTML = `<div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-6">${cards}</div>
                ${loading ? '<div class="text-center mt-8 animate-spin text-3xl">◌</div>' : ''}
                ${hasMore && !loading ? '<div class="text-center mt-8"><button onclick="page++;fetchContent()" class="bg-indigo-600 px-6 py-2 rounded-full">Load More</button></div>' : ''}`;
            }
        }

        window.nextEp = async () => {
            if (curE < maxE) { curE++; render(); }
            else { 
                const nS = selected.seasons.find(s => s.season_number == curS + 1); 
                if(nS) { curS++; curE=1; await updateMaxEp(); render(); } else alert("End of Series"); 
            }
        };

        $('search-input').oninput = e => { query=e.target.value; page=1; fetchContent(); };
        window.onload = fetchContent;
    </script>
</body>
</html>
